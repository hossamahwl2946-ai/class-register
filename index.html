    <style>

        .active-tab { background-color: rgba(255, 255, 255, 0.25); font-weight: bold; }

            body * { visibility: hidden !important; }
            #single-receipt-print, #single-receipt-print *, #report-print, #report-print * { visibility: visible !important; }

                position: absolute !important;
                left: 0 !important;

    /* ===== الشكل الجديد: تدرجات الأزرق والأحمر والأصفر ===== */
        body { font-family: 'Cairo', system-ui, sans-serif !important; background: linear-gradient(135deg, #e0f2fe 0%, #fff7ed 55%, #fef9c3 100%) fixed !important; color: #1e293b; }
        aside[class*="bg-[#7A8C63]"] { background: linear-gradient(180deg, #2563eb 0%, #38bdf8 100%) !important; }

        button:hover { transform: translateY(-1px); filter: brightness(1.06); }
        button:active { transform: scale(.97); }
        [class*="bg-[#7A8C63]"]:not(aside) { background: linear-gradient(135deg, #2563eb, #0ea5e9) !important; color: #fff !important; box-shadow: 0 4px 12px rgba(37,99,235,.3); }
        [class*="bg-gray-800"] { background: linear-gradient(135deg, #ef4444, #f97316) !important; color: #fff !important; box-shadow: 0 4px 12px rgba(239,68,68,.3); }
        [class*="bg-amber-600"] { background: linear-gradient(135deg, #fde047, #f59e0b) !important; color: #713f12 !important; box-shadow: 0 4px 12px rgba(245,158,11,.35); }
        [class*="bg-gray-200"] { background: #dbeafe !important; color: #1e40af !important; }
        [class*=" text-[#7A8C63]"] { color: #2563eb !important; }
        [class*=" text-[#C99A3B]"] { color: #f59e0b !important; }
        .group:nth-child(1) { border-top: 5px solid #2563eb !important; }
        .group:nth-child(2) { border-top: 5px solid #facc15 !important; }
        main h2 { color: #1e40af; border-right: 6px solid #facc15; padding-right: 12px; }
        [class*="rounded-xl"][class*="bg-white"]:not(#single-receipt-print) { border: 1px solid #fff !important; border-radius: 20px !important; box-shadow: 0 8px 24px rgba(37,99,235,.12) !important; }
        input:not([type=checkbox]), select, textarea { border: 1.5px solid #bfdbfe !important; border-radius: 12px !important; background: #fff; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb !important; box-shadow: 0 0 0 3px rgba(37,99,235,.2); }
        thead tr { background: linear-gradient(90deg, #dbeafe, #fef9c3) !important; color: #1e3a8a !important; }
        tbody tr:hover { background: #eff6ff !important; }
        .fixed.inset-0 { background: rgba(30,58,138,.35) !important; backdrop-filter: blur(4px); }
        @media print { body { background: #fff !important; } }

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        const todayStr = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
        const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
        const monthLabel = m => MONTHS[Number(m.slice(5, 7)) - 1] + " " + m.slice(0, 4);
        const gradeKind = g => g.kind || ((g.title || "").includes("تسميع") ? "تسميع" : "كويز");
        function sanitize(d) { const o = { ...EMPTY_DATA, ...(d || {}) }; for (const k in EMPTY_DATA) if (!Array.isArray(o[k])) o[k] = []; const m = new Map(); o.attendance.forEach(a => m.set(a.date + "|" + a.studentId, a)); o.attendance = [...m.values()]; return o; }

        function normalizePhone(p) {
            if (!p) return "";
            let d = p.replace(/\D/g, "");
            if (d.startsWith("0")) d = "20" + d.slice(1);
            else if (!d.startsWith("20")) d = "20" + d;
            return d;
        }

        function openWhatsApp(phone, message) {
            const n = normalizePhone(phone);
            if (!n) return;
            window.open(`https://wa.me/${n}?text=${encodeURIComponent(message)}`, "_blank");
        }

        const EMPTY_DATA = { groups: [], students: [], attendance: [], grades: [], payments: [] };

        function MonthlyReport({ r }) {
            const tbl = (rows, empty) => rows.length ? (
                <table className="w-full text-right text-xs mb-3">
                    <thead><tr className="bg-gray-100 border-b"><th className="p-2">التاريخ</th><th className="p-2">العنوان</th><th className="p-2 text-center">الدرجة</th></tr></thead>
                    <tbody>{rows.map(g => <tr key={g.id} className="border-b"><td className="p-2">{g.date}</td><td className="p-2">{g.title}</td><td className="p-2 text-center font-bold">{g.score} / {g.maxScore}</td></tr>)}</tbody>
                </table>
            ) : <p className="text-xs text-gray-500 mb-3">{empty}</p>;
            return (
                <div>
                    <h3 className="text-xl font-bold mb-1">📄 التقرير الشهري: {r.s.name}</h3>
                    <p className="text-sm text-gray-600 mb-3">{r.group} — {r.label}</p>
                    <div className="grid grid-cols-4 gap-2 text-center mb-3 text-xs font-bold">
                        <div className="bg-emerald-50 p-2 rounded border">حضور: {r.present}</div>
                        <div className="bg-red-50 p-2 rounded border">غياب: {r.absent}</div>
                        <div className="bg-gray-50 p-2 rounded border">لم يُسجَّل: {r.none}</div>
                        <div className="bg-blue-50 p-2 rounded border">النسبة: {r.pct === null ? "-" : r.pct + "%"}</div>
                    </div>
                    <h4 className="font-bold text-sm mb-1">الحضور والغياب</h4>
                    <div className="flex flex-wrap gap-1 mb-3">
                        {r.att.length ? r.att.map(a => <span key={a.date} className={`px-2 py-1 rounded text-xs font-bold ${a.status === "حضور" ? "bg-emerald-100 text-emerald-700" : a.status === "غياب" ? "bg-red-100 text-red-700" : "bg-gray-200 text-gray-600"}`}>{a.date}: {a.status}</span>) : <span className="text-xs text-gray-500">لا توجد حصص مسجلة في هذا الشهر</span>}
                    </div>
                    <h4 className="font-bold text-sm mb-1">التسميعات {r.recAvg !== null && `(المعدل ${r.recAvg}%)`}</h4>
                    {tbl(r.rec, "لا توجد تسميعات")}
                    <h4 className="font-bold text-sm mb-1">الكويزات {r.quizAvg !== null && `(المعدل ${r.quizAvg}%)`}</h4>
                    {tbl(r.quiz, "لا توجد كويزات")}
                </div>
            );
        }

        const SB_URL = "https://melzewjqsbrdssxkbgpu.supabase.co", SB_KEY = "sb_publishable_Hw5i1n2CeZXwMTH2Gm8JxQ_5N73RSsN";
        const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;
        const cloudSan = d => typeof sanitize === "function" ? sanitize(d) : { ...EMPTY_DATA, ...(d || {}) };
        const canon = v => JSON.stringify(v, (k, x) => x && typeof x === "object" && !Array.isArray(x) ? Object.fromEntries(Object.entries(x).sort(([a], [b]) => a < b ? -1 : 1)) : x);

        function App() {
            const [activeTab, setActiveTab] = useState("dashboard");
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem("v_data");
                try { return sanitize(saved ? JSON.parse(saved) : null); } catch (e) { return EMPTY_DATA; }
            });

            const fileInputRef = useRef(null);
            const [dirty, setDirty] = useState(() => localStorage.getItem("v_dirty") === "1");
            const [printMode, setPrintMode] = useState(null);
            const [gKind, setGKind] = useState("تسميع");
            const [rGroup, setRGroup] = useState("");
            const [rStudent, setRStudent] = useState("");
            const [rMonth, setRMonth] = useState(todayStr().slice(0, 7));
            useEffect(() => { const f = () => setPrintMode(null); window.addEventListener("afterprint", f); return () => window.removeEventListener("afterprint", f); }, []);

            // Modals for Groups & Students
            const [gModal, setGModal] = useState(false);
            const [editingGroup, setEditingGroup] = useState(null);
            const [gForm, setGForm] = useState({ name: "", fee: "", days: "" });
            
            const [sModal, setSModal] = useState(false);
            const [editingStudent, setEditingStudent] = useState(null);
            const [sForm, setSForm] = useState({ name: "", groupId: "", studentPhone: "", parentPhone: "" });

            // Specific Detail Modals & Single Receipt Printing
            const [detailModal, setDetailModal] = useState(null);
            const [singlePrintData, setSinglePrintData] = useState(null);

            // Filters
            const [selectedGroup, setSelectedGroup] = useState("");
            const [studentTabFilter, setStudentTabFilter] = useState(""); 
            const [attDate, setAttDate] = useState(todayStr());
            const [attFilter, setAttFilter] = useState("all");
            const [examTitle, setExamTitle] = useState("تسميع درس جديد");
            const [maxScore, setMaxScore] = useState("10");
            const [payMonth, setPayMonth] = useState(todayStr().slice(0, 7));

            // Broadcast Messages State
            const [broadcastGroup, setBroadcastGroup] = useState("");
            const [broadcastTarget, setBroadcastTarget] = useState("parents"); 
            const [broadcastMsg, setBroadcastMsg] = useState("");
            const [selectedRecipients, setSelectedRecipients] = useState({});

            const [session, setSession] = useState(null);
            const [authReady, setAuthReady] = useState(false);
            const [loaded, setLoaded] = useState(false);
            const [cloudMsg, setCloudMsg] = useState("");
            const [loginForm, setLoginForm] = useState({ email: "", password: "" });
            const cloudVer = useRef(null), lastSynced = useRef(""), timer = useRef(null), syncQ = useRef(Promise.resolve()), busy = useRef(false);

            const markSaved = () => { try { setDirty(false); localStorage.setItem("v_dirty", "0"); } catch (e) {} };
            const nowTime = () => new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" });

            async function loadCloud() {
                const { data: row, error } = await sb.from("class_data").select("data,updated_at").eq("id", 1).single();
                if (error) throw error;
                cloudVer.current = row.updated_at;
                const d = cloudSan(row.data || {});
                lastSynced.current = JSON.stringify(d);
                setData(d); localStorage.setItem("v_data", lastSynced.current);
                return d;
            }

            async function push(d, force) {
                let qy = sb.from("class_data").update({ data: d, updated_at: new Date().toISOString() }).eq("id", 1);
                if (!force && cloudVer.current) qy = qy.eq("updated_at", cloudVer.current);
                const { data: rows, error } = await qy.select("updated_at");
                if (error) throw error;
                if (!rows || !rows.length) throw new Error("conflict");
                cloudVer.current = rows[0].updated_at; lastSynced.current = JSON.stringify(d);
            }

            async function doLogin() {
                setCloudMsg("");
                const { error } = await sb.auth.signInWithPassword({ email: loginForm.email.trim(), password: loginForm.password });
                if (error) setCloudMsg("❌ " + (error.message === "Invalid login credentials" ? "الإيميل أو كلمة السر غلط" : error.message));
            }

            async function logout() {
                if (localStorage.getItem("v_unsynced") === "1" && !confirm("فيه تعديلات ما اترفعتش للسيرفر وهتضيع لو خرجت. تخرج برضه؟")) return;
                await sb.auth.signOut();
                localStorage.removeItem("v_data"); localStorage.removeItem("v_unsynced");
                setData(EMPTY_DATA); setLoaded(false); setCloudMsg("");
            }

            useEffect(() => {
                if (!sb) return;
                sb.auth.getSession().then(({ data: r }) => { setSession(r.session); setAuthReady(true); });
                const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
                return () => sub.subscription.unsubscribe();
            }, []);

            useEffect(() => {
                if (!sb || !session || loaded) return;
                (async () => {
                    try {
                        setCloudMsg("");
                        const local = data, unsynced = localStorage.getItem("v_unsynced") === "1";
                        const { data: row, error } = await sb.from("class_data").select("data,updated_at").eq("id", 1).single();
                        if (error) throw error;
                        cloudVer.current = row.updated_at;
                        const cloud = cloudSan(row.data || {});
                        if (unsynced && local.students.length && confirm("فيه تعديلات في المتصفح ما اترفعتش للسيرفر. موافق = ارفعها واستبدل اللي على السيرفر. إلغاء = حمّل نسخة السيرفر.")) await push(local, true);
                        else if (cloud.students.length) {
                            if (local.students.length && canon(local) !== canon(cloud) && !confirm("بيانات السيرفر مختلفة عن اللي محفوظ في المتصفح. موافق = حمّل بيانات السيرفر. إلغاء = ارفع بيانات المتصفح واستبدل السيرفر.")) await push(local, true);
                            else await loadCloud();
                        }
                        else if (local.students.length && confirm("السيرفر لسه فاضي وفيه بيانات في المتصفح. أرفعها للسيرفر؟")) await push(local, true);
                        localStorage.removeItem("v_unsynced"); setCloudMsg("✅ متصل بالسيرفر"); setLoaded(true);
                    } catch (e) { setCloudMsg("⚠ تعذّر تحميل البيانات: " + e.message); }
                })();
            }, [session]);

            useEffect(() => {
                if (!sb || !session || !loaded) return;
                if (JSON.stringify(data) === lastSynced.current) return;
                const d = data;
                localStorage.setItem("v_unsynced", "1"); busy.current = true; setCloudMsg("⏳ جاري الحفظ...");
                clearTimeout(timer.current);
                timer.current = setTimeout(() => { syncQ.current = syncQ.current.then(async () => {
                    try { await push(d, false); localStorage.removeItem("v_unsynced"); busy.current = false; markSaved(); setCloudMsg("✅ اتحفظ " + nowTime()); }
                    catch (e) {
                        busy.current = false;
                        if (e.message === "conflict") {
                            try {
                                if (confirm("البيانات على السيرفر اتحدّثت من جهاز تاني. موافق = حمّل نسخة السيرفر (آخر تعديل عندك هيضيع). إلغاء = استبدل السيرفر بنسختك.")) { await loadCloud(); setCloudMsg("✅ اتحمّلت نسخة السيرفر"); }
                                else { await push(d, true); setCloudMsg("✅ اتحفظ " + nowTime()); }
                                localStorage.removeItem("v_unsynced"); markSaved();
                            } catch (e2) { setCloudMsg("⚠ " + e2.message); }
                        } else setCloudMsg("⚠ ما اتحفظش على السيرفر (" + e.message + ")");
                    }
                }); }, 700);
            }, [data]);

            useEffect(() => { const f = e => { if (busy.current) { e.preventDefault(); e.returnValue = ""; } }; window.addEventListener("beforeunload", f); return () => window.removeEventListener("beforeunload", f); }, []);

            function saveData(newData) {
                setData(newData);
                localStorage.setItem("v_data", JSON.stringify(newData));
                localStorage.setItem("v_dirty", "1"); setDirty(true);
            }

            // Export & Import Backup
            function exportBackup() {
                const backup = {
                    v_data: localStorage.getItem("v_data")
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backup));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `ClassRegister_Backup_${todayStr()}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                localStorage.setItem("v_dirty", "0"); setDirty(false);
            }

            function importBackup(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (!parsed.v_data) throw new Error("bad");
                        {
                            const clean = sanitize(JSON.parse(parsed.v_data));
                            if (!confirm("سيتم استبدال البيانات الحالية بالنسخة المستوردة. متابعة؟")) return;
                            localStorage.setItem("v_data", JSON.stringify(clean));
                            setData(clean); localStorage.setItem("v_dirty", "0"); setDirty(false);
                        }
                        alert("✅ تم استيراد النسخة الاحتياطية بنجاح 100%!");
                    } catch (err) {
                        alert("❌ الملف المختار غير صالح.");
                    }
                };
                reader.readAsText(file);
            }

            // إدارة المجموعات
            function openAddGroupModal() {
                setEditingGroup(null);
                setGForm({ name: "", fee: "", days: "" });
                setGModal(true);
            }

            function openEditGroupModal(group) {
                setEditingGroup(group);
                setGForm({ name: group.name, fee: group.fee, days: group.days });
                setGModal(true);
            }

            function handleSaveGroup() {
                if (!gForm.name) return alert("يرجى إدخال اسم المجموعة");
                if (editingGroup) {
                    const updatedGroups = data.groups.map(g => g.id === editingGroup.id ? { ...g, ...gForm } : g);
                    saveData({ ...data, groups: updatedGroups });
                } else {
                    saveData({ ...data, groups: [...data.groups, { id: genId(), ...gForm }] });
                }
                setGModal(false);
            }

            function handleDeleteGroup(groupId) {
                if (confirm("هل أنت متأكد من حذف هذه المجموعة؟ سيتم حذف جميع الطلاب والسجلات المرتبطة بها.")) {
                    const updatedGroups = data.groups.filter(g => g.id !== groupId);
                    const updatedStudents = data.students.filter(s => s.groupId !== groupId);
                    const updatedAttendance = data.attendance.filter(a => a.groupId !== groupId);
                    const updatedGrades = data.grades.filter(g => g.groupId !== groupId);
                    const updatedPayments = data.payments.filter(p => p.groupId !== groupId);
                    
                    saveData({
                        ...data,
                        groups: updatedGroups,
                        students: updatedStudents,
                        attendance: updatedAttendance,
                        grades: updatedGrades,
                        payments: updatedPayments
                    });
                    if (selectedGroup === groupId) setSelectedGroup("");
                }
            }

            // إدارة الطلاب
            function openAddStudentModal() {
                setEditingStudent(null);
                setSForm({ name: "", groupId: selectedGroup || (data.groups[0]?.id || ""), studentPhone: "", parentPhone: "" });
                setSModal(true);
            }

            function openEditStudentModal(student) {
                setEditingStudent(student);
                setSForm({ name: student.name, groupId: student.groupId, studentPhone: student.studentPhone || "", parentPhone: student.parentPhone || "" });
                setSModal(true);
            }

            function handleSaveStudent() {
                if (!sForm.name || !sForm.groupId) return alert("يرجى إدخال اسم الطالب واختيار المجموعة");
                if (editingStudent) {
                    const updatedStudents = data.students.map(s => s.id === editingStudent.id ? { ...s, ...sForm } : s);
                    saveData({ ...data, students: updatedStudents });
                } else {
                    saveData({ ...data, students: [...data.students, { id: genId(), ...sForm }] });
                }
                setSModal(false);
            }

            function handleDeleteStudent(studentId) {
                if (confirm("هل أنت متأكد من حذف هذا الطالب؟")) {
                    const updatedStudents = data.students.filter(s => s.id !== studentId);
                    const updatedAttendance = data.attendance.filter(a => a.studentId !== studentId);
                    const updatedGrades = data.grades.filter(g => g.studentId !== studentId);
                    const updatedPayments = data.payments.filter(p => p.studentId !== studentId);

                    saveData({
                        ...data,
                        students: updatedStudents,
                        attendance: updatedAttendance,
                        grades: updatedGrades,
                        payments: updatedPayments
                    });
                }
            }

            const filteredStudents = useMemo(() => {
                if (!selectedGroup) return [];
                return data.students.filter(s => s.groupId === selectedGroup);
            }, [selectedGroup, data.students]);

            const studentsListDisplayed = useMemo(() => {
                if (!studentTabFilter) return data.students;
                return data.students.filter(s => s.groupId === studentTabFilter);
            }, [studentTabFilter, data.students]);

            const attendanceStats = useMemo(() => {
                if (!selectedGroup) return { presentCount: 0, absentCount: 0, total: 0 };
                const groupStudents = data.students.filter(s => s.groupId === selectedGroup);
                let presentCount = 0;
                let absentCount = 0;

                groupStudents.forEach(s => {
                    const record = data.attendance.find(a => a.date === attDate && a.studentId === s.id);
                    if (record && record.status === "حضور") presentCount++;
                    else if (record && record.status === "غياب") absentCount++;
                });

                return { presentCount, absentCount, total: groupStudents.length };
            }, [selectedGroup, attDate, data.attendance, data.students]);

            const displayedAttendanceStudents = useMemo(() => {
                return filteredStudents.filter(s => {
                    const attRecord = data.attendance.find(a => a.date === attDate && a.studentId === s.id);
                    const st = attRecord ? attRecord.status : null;
                    if (attFilter === "present") return st === "حضور";
                    if (attFilter === "absent") return st === "غياب";
                    if (attFilter === "none") return !st;
                    return true;
                });
            }, [filteredStudents, attFilter, attDate, data.attendance]);

            // قائمة الرسائل الجماعية
            const broadcastList = useMemo(() => {
                let targetStudents = data.students;
                if (broadcastGroup) {
                    targetStudents = targetStudents.filter(s => s.groupId === broadcastGroup);
                }
                
                let list = [];
                targetStudents.forEach(s => {
                    if ((broadcastTarget === "students" || broadcastTarget === "all") && s.studentPhone) {
                        list.push({ id: s.id + "_s", name: s.name + " (طالب)", phone: s.studentPhone, role: "طالب" });
                    }
                    if ((broadcastTarget === "parents" || broadcastTarget === "all") && s.parentPhone) {
                        list.push({ id: s.id + "_p", name: s.name + " (ولي أمر)", phone: s.parentPhone, role: "ولي أمر" });
                    }
                });
                return list;
            }, [broadcastGroup, broadcastTarget, data.students]);

            useEffect(() => {
                const initial = {};
                broadcastList.forEach(item => { initial[item.id] = true; });
                setSelectedRecipients(initial);
            }, [broadcastGroup, broadcastTarget, data.students]);

            function toggleSelectAllBroadcast(checked) {
                const updated = {};
                broadcastList.forEach(item => { updated[item.id] = checked; });
                setSelectedRecipients(updated);
            }

            function sendBroadcastToAll() {
                if (!broadcastMsg) return alert("يرجى كتابة نص الرسالة العامة أولاً");
                const recipientsToSend = broadcastList.filter(item => selectedRecipients[item.id]);
                if (recipientsToSend.length === 0) return alert("لم تقم بتحديد أي مستلم من القائمة");

                if (confirm(`هل أنت متأكد من فتح الواتساب لإرسال الرسالة إلى (${recipientsToSend.length}) شخصاً؟`)) {
                    recipientsToSend.forEach((item, index) => {
                        setTimeout(() => {
                            openWhatsApp(item.phone, broadcastMsg);
                        }, index * 1200);
                    });
                }
            }

            function setAtt(studentId, status) {
                const rest = data.attendance.filter(a => !(a.date === attDate && a.studentId === studentId));
                saveData({ ...data, attendance: [...rest, { id: genId(), date: attDate, studentId, groupId: selectedGroup, status }] });
            }

            function markUnrecordedPresent() {
                const add = filteredStudents.filter(s => !data.attendance.some(a => a.date === attDate && a.studentId === s.id)).map(s => ({ id: genId(), date: attDate, studentId: s.id, groupId: selectedGroup, status: "حضور" }));
                saveData({ ...data, attendance: [...data.attendance, ...add] });
            }

            function toggleAttendance(studentId) {
                const existing = data.attendance.find(a => a.date === attDate && a.studentId === studentId);
                let newAttendance;
                if (existing) {
                    newAttendance = data.attendance.map(a => 
                        a.date === attDate && a.studentId === studentId 
                        ? { ...a, status: a.status === "حضور" ? "غياب" : "حضور" } : a
                    );
                } else {
                    newAttendance = [...data.attendance, { id: genId(), date: attDate, studentId, groupId: selectedGroup, status: "حضور" }];
                }
                saveData({ ...data, attendance: newAttendance });
            }

            function setGrade(studentId, score) {
                const t = examTitle.trim();
                const rest = data.grades.filter(g => !(g.date === attDate && g.studentId === studentId && g.title === t && gradeKind(g) === gKind));
                const next = score === "" ? rest : [...rest, { id: genId(), date: attDate, studentId, groupId: selectedGroup, kind: gKind, title: t, score: Number(score), maxScore: Number(maxScore) }];
                saveData({ ...data, grades: next });
            }

            function handleGradeChange(studentId, score) {
                const existing = data.grades.find(g => g.date === attDate && g.studentId === studentId);
                let newGrades;
                if (existing) {
                    newGrades = data.grades.map(g => g.date === attDate && g.studentId === studentId ? { ...g, score: Number(score), title: examTitle, maxScore: Number(maxScore) } : g);
                } else {
                    newGrades = [...data.grades, { id: genId(), date: attDate, studentId, groupId: selectedGroup, title: examTitle, score: Number(score), maxScore: Number(maxScore) }];
                }
                saveData({ ...data, grades: newGrades });
            }

            function togglePayment(studentId, amount) {
                const existing = data.payments.find(p => p.month === payMonth && p.studentId === studentId);
                let newPayments;
                if (existing) {
                    newPayments = data.payments.filter(p => !(p.month === payMonth && p.studentId === studentId));
                } else {
                    newPayments = [...data.payments, { id: genId(), month: payMonth, studentId, groupId: selectedGroup, amount: Number(amount), status: "مدفوع" }];
                }
                saveData({ ...data, payments: newPayments });
            }

            // دالة الطباعة الخاصة بالطالب المحدد فقط
            function printSingleStudent(type, student) {
                const group = data.groups.find(g => g.id === student.groupId);
                setPrintMode("receipt");
                if (type === "grade") {
                    const gradeRecord = data.grades.find(g => g.date === attDate && g.studentId === student.id && g.title === examTitle.trim() && gradeKind(g) === gKind);
                    setSinglePrintData({
                        type: "grade",
                        studentName: student.name,
                        groupName: group ? group.name : "غير محدد",
                        date: attDate,
                        title: examTitle,
                        score: gradeRecord ? gradeRecord.score : "غير مرصود",
                        maxScore: maxScore
                    });
                } else if (type === "payment") {
                    const payRecord = data.payments.find(p => p.month === payMonth && p.studentId === student.id);
                    const isPaid = payRecord ? payRecord.status === "مدفوع" : false;
                    setSinglePrintData({
                        type: "payment",
                        studentName: student.name,
                        groupName: group ? group.name : "غير محدد",
                        month: payMonth,
                        fee: group ? group.fee : 0,
                        isPaid: isPaid
                    });
                }

                setTimeout(() => {
                    window.print();
                }, 200);
            }

            const reportData = useMemo(() => {
                const s = data.students.find(x => x.id === rStudent);
                if (!s || !rMonth) return null;
                const grp = data.groups.find(g => g.id === s.groupId);
                const inM = d => d.startsWith(rMonth);
                const dates = [...new Set(data.attendance.filter(a => inM(a.date) && (a.groupId === s.groupId || a.studentId === s.id)).map(a => a.date))].sort();
                const att = dates.map(d => ({ date: d, status: (data.attendance.find(a => a.date === d && a.studentId === s.id) || {}).status || "لم يُسجَّل" }));
                const present = att.filter(a => a.status === "حضور").length, absent = att.filter(a => a.status === "غياب").length;
                const gr = data.grades.filter(g => g.studentId === s.id && inM(g.date)).sort((a, b) => a.date.localeCompare(b.date));
                const avg = list => { const m = list.reduce((t, g) => t + (g.maxScore || 10), 0); return m ? Math.round(list.reduce((t, g) => t + g.score, 0) / m * 100) : null; };
                const rec = gr.filter(g => gradeKind(g) === "تسميع"), quiz = gr.filter(g => gradeKind(g) === "كويز");
                return { s, group: grp ? grp.name : "-", label: monthLabel(rMonth), att, present, absent, none: att.length - present - absent, pct: present + absent ? Math.round(present / (present + absent) * 100) : null, rec, quiz, recAvg: avg(rec), quizAvg: avg(quiz) };
            }, [data, rStudent, rMonth]);

            function printReport() { setPrintMode("report"); setTimeout(() => window.print(), 200); }

            function sendReport() {
                const r = reportData;
                if (!r || !r.s.parentPhone) return alert("لا يوجد رقم هاتف لولي الأمر");
                const line = g => `${g.title} (${g.date}): ${g.score}/${g.maxScore}`;
                const abs = r.att.filter(a => a.status === "غياب").map(a => a.date).join("، ");
                const msg = `السلام عليكم، تقرير الطالب/ة (${r.s.name}) عن شهر ${r.label}:\n✅ الحضور: ${r.present} | ❌ الغياب: ${r.absent}${abs ? " (" + abs + ")" : ""}\n📖 التسميعات:\n${r.rec.map(line).join("\n") || "لا يوجد"}\n📝 الكويزات:\n${r.quiz.map(line).join("\n") || "لا يوجد"}`;
                openWhatsApp(r.s.parentPhone, msg);
            }

            // تفاصيل سجل الطالب الشامل
            const detailModalData = useMemo(() => {
                if (!detailModal || !detailModal.student) return null;
                const s = detailModal.student;
                const type = detailModal.type;

                if (type === "attendance") {
                    const records = data.attendance.filter(a => a.studentId === s.id).sort((a,b) => b.date.localeCompare(a.date));
                    const present = records.filter(a => a.status === "حضور").length;
                    const absent = records.filter(a => a.status === "غياب").length;
                    const total = records.length;
                    const percentage = total ? Math.round((present / total) * 100) : 0;
                    return { records, present, absent, total, percentage };
                }

                if (type === "grades") {
                    const records = data.grades.filter(g => g.studentId === s.id).sort((a,b) => b.date.localeCompare(a.date));
                    let totalScore = 0;
                    let totalMax = 0;
                    records.forEach(r => {
                        totalScore += r.score || 0;
                        totalMax += r.maxScore || 10;
                    });
                    const avg = totalMax ? Math.round((totalScore / totalMax) * 100) : 0;
                    return { records, totalScore, totalMax, avg };
                }

                if (type === "payments") {
                    const records = data.payments.filter(p => p.studentId === s.id).sort((a,b) => b.month.localeCompare(a.month));
                    const totalPaid = records.reduce((sum, p) => sum + (p.amount || 0), 0);
                    return { records, totalPaid };
                }

                return null;
            }, [detailModal, data]);

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    {(!session || !loaded) && (
                        <div className="z-[100] flex items-center justify-center p-4" style={{ position: "fixed", top: 0, right: 0, bottom: 0, left: 0, background: "#e0f2fe" }}>
                            <div className="bg-white p-6 rounded-xl shadow-lg w-full max-w-sm flex flex-col gap-3">
                                <h2 className="text-xl font-bold text-center">🔐 سجل الفصل الذكي</h2>
                                {!sb ? <p className="text-red-600 text-sm text-center">تعذّر تحميل مكتبة الحفظ السحابي. اتأكد من الإنترنت وحدّث الصفحة.</p>
                                : !authReady ? <p className="text-center text-sm">⏳ لحظة...</p>
                                : !session ? (
                                    <>
                                        <input className="border p-2 rounded" type="email" placeholder="الإيميل" value={loginForm.email} onChange={e => setLoginForm({ ...loginForm, email: e.target.value })} />
                                        <input className="border p-2 rounded" type="password" placeholder="كلمة السر" value={loginForm.password} onChange={e => setLoginForm({ ...loginForm, password: e.target.value })} onKeyDown={e => e.key === "Enter" && doLogin()} />
                                        <button className="bg-[#7A8C63] text-white p-2 rounded font-bold cursor-pointer" onClick={doLogin}>دخول</button>
                                    </>
                                ) : <p className="text-center text-sm">⏳ جاري تحميل البيانات...</p>}
                                {cloudMsg && <p className="text-sm text-center">{cloudMsg}</p>}
                                {session && !loaded && cloudMsg.startsWith("⚠") && <button className="bg-gray-200 p-2 rounded font-bold cursor-pointer text-sm" onClick={() => window.location.reload()}>إعادة المحاولة</button>}
                            </div>
                        </div>
                    )}
                    
                    {/* الإيصال المنفرد المحدد للطباعة فقط */}
                    {printMode === "receipt" && singlePrintData && (
                        <div id="single-receipt-print" className="hidden print:block p-8 border-2 border-black rounded-xl max-w-md mx-auto text-center my-10 bg-white">
                            <h2 className="text-2xl font-bold mb-1">🧾 {singlePrintData.type === 'grade' ? 'تقرير نتيجة اختبار' : 'إيصال استلام نقدية'}</h2>
                            <p className="text-xs text-gray-600 mb-4">سجل الفصل الذكي</p>
                            <hr className="mb-4 border-black" />
                            {singlePrintData.type === "grade" ? (
                                <div className="text-right flex flex-col gap-3 text-base">
                                    <p><strong>اسم الطالب:</strong> {singlePrintData.studentName}</p>
                                    <p><strong>المجموعة:</strong> {singlePrintData.groupName}</p>
                                    <p><strong>الاختبار / التسميع:</strong> {singlePrintData.title}</p>
                                    <p><strong>التاريخ:</strong> {singlePrintData.date}</p>
                                    <div className="mt-4 p-4 border-2 border-dashed border-gray-400 text-center rounded-lg bg-gray-50">
                                        <span className="block text-xs text-gray-500 mb-1">النتيجة المحصلة</span>
                                        <span className="text-2xl font-bold text-black">{singlePrintData.score} / {singlePrintData.maxScore}</span>
                                    </div>
                                </div>
                            ) : (
                                <div className="text-right flex flex-col gap-3 text-base">
                                    <p><strong>اسم الطالب:</strong> {singlePrintData.studentName}</p>
                                    <p><strong>المجموعة:</strong> {singlePrintData.groupName}</p>
                                    <p><strong>اشتراك شهر:</strong> {singlePrintData.month}</p>
                                    <p><strong>المبلغ المطلوب:</strong> {singlePrintData.fee} جنيه</p>
                                    <div className="mt-4 p-4 border-2 border-dashed border-gray-400 text-center rounded-lg bg-gray-50">
                                        <span className="block text-xs text-gray-500 mb-1">حالة السداد</span>
                                        <span className="text-2xl font-bold text-black">
                                            {singlePrintData.isPaid ? "✅ تم الاستلام بنجاح" : "❌ لم يتم السداد"}
                                        </span>
                                    </div>
                                </div>
                            )}
                            <div className="mt-10 text-xs text-gray-600 flex justify-between border-t border-gray-300 pt-4">
                                <span>توقيع المدرس: ....................</span>
                                <span>تاريخ الطباعة: {todayStr()}</span>
                            </div>
                        </div>
                    )}

                    {printMode === "report" && reportData && (
                        <div id="report-print" className="hidden print:block p-6 bg-white"><MonthlyReport r={reportData} /></div>
                    )}

                    {/* Sidebar */}
                    <aside className="bg-[#7A8C63] text-white w-full md:w-64 p-5 flex flex-col gap-4 shrink-0 no-print">
                        <h1 className="text-xl font-bold border-b border-white/20 pb-3 text-center md:text-right">📚 سجل الفصل الذكي</h1>
                        <nav className="flex flex-row md:flex-col gap-1 overflow-x-auto md:overflow-x-visible whitespace-nowrap pb-2 md:pb-0">
                            <button className={`p-2 rounded text-right cursor-pointer text-sm ${activeTab === 'dashboard' ? 'active-tab' : ''}`} onClick={() => setActiveTab('dashboard')}>لوحة التحكم</button>
                            <button className={`p-2 rounded text-right cursor-pointer text-sm ${activeTab === 'groups' ? 'active-tab' : ''}`} onClick={() => setActiveTab('groups')}>المجموعات</button>
                            <button className={`p-2 rounded text-right cursor-pointer text-sm ${activeTab === 'students' ? 'active-tab' : ''}`} onClick={() => setActiveTab('students')}>قائمة الطلاب</button>
                            <button className={`p-2 rounded text-right cursor-pointer text-sm ${activeTab === 'attendance' ? 'active-tab' : ''}`} onClick={() => setActiveTab('attendance')}>الحضور والغياب</button>
                            <button className={`p-2 rounded text-right cursor-pointer text-sm ${activeTab === 'grades' ? 'active-tab' : ''}`} onClick={() => setActiveTab('grades')}>التسميعات والكويزات</button>
                            <button className={`p-2 rounded text-right cursor-pointer text-sm ${activeTab === 'payments' ? 'active-tab' : ''}`} onClick={() => setActiveTab('payments')}>المصروفات والسداد</button>
                            <button className={`p-2 rounded text-right cursor-pointer text-sm ${activeTab === 'report' ? 'active-tab' : ''}`} onClick={() => setActiveTab('report')}>📄 تقرير الطالب الشهري</button>
                            <button className={`p-2 rounded text-right cursor-pointer text-sm bg-amber-600/60 hover:bg-amber-600 font-bold ${activeTab === 'broadcast' ? 'active-tab' : ''}`} onClick={() => setActiveTab('broadcast')}>📢 الرسائل الجماعية</button>
                        </nav>
                        
                        <div className="border-t border-white/20 pt-3 mt-auto flex flex-col gap-2">
                            {dirty && <div className="text-xs bg-amber-500/80 rounded p-2 text-center font-bold">⚠ فيه تغييرات لسه ما اتصدّرتش لملف JSON</div>}
                            <button className="bg-white/20 hover:bg-white/30 text-white p-2 rounded text-xs text-center font-bold cursor-pointer" onClick={exportBackup}>
                                📥 تصدير نسخة احتياطية
                            </button>
                            <button className="bg-white/20 hover:bg-white/30 text-white p-2 rounded text-xs text-center font-bold cursor-pointer" onClick={() => fileInputRef.current.click()}>
                                📤 استيراد نسخة احتياطية
                            </button>
                            <input type="file" ref={fileInputRef} onChange={importBackup} accept=".json" className="hidden" />
                            <div className="text-xs bg-white/20 rounded p-2 text-center font-bold flex flex-col gap-1">
                                <span>{cloudMsg || "☁️ متصل بالسيرفر"}</span>
                                {cloudMsg.startsWith("⚠") && <button className="underline cursor-pointer" onClick={() => setData({ ...data })}>🔁 إعادة المحاولة</button>}
                                <button className="underline cursor-pointer" onClick={logout}>🚪 تسجيل الخروج</button>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 p-6 overflow-x-hidden no-print">
                        
                        {/* Dashboard */}
                        {activeTab === "dashboard" && (
                            <div>
                                <h2 className="text-2xl font-bold text-gray-800 mb-2">لوحة التحكم السريعة</h2>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
                                    <div className="bg-white p-5 rounded-xl shadow border border-neutral-200 cursor-pointer hover:border-[#7A8C63] transition group" onClick={() => setActiveTab("groups")}>
                                        <div className="text-gray-500 text-sm group-hover:text-[#7A8C63]">إجمالي المجموعات ↗</div>
                                        <div className="text-3xl font-bold text-[#7A8C63]">{data.groups.length}</div>
                                    </div>
                                    <div className="bg-white p-5 rounded-xl shadow border border-neutral-200 cursor-pointer hover:border-[#C99A3B] transition group" onClick={() => { setStudentTabFilter(""); setActiveTab("students"); }}>
                                        <div className="text-gray-500 text-sm group-hover:text-[#C99A3B]">إجمالي الطلاب المسجلين ↗</div>
                                        <div className="text-3xl font-bold text-[#C99A3B]">{data.students.length}</div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Groups */}
                        {activeTab === "groups" && (
                            <div>
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-2xl font-bold text-gray-800">إدارة المجموعات</h2>
                                    <button className="bg-[#7A8C63] text-white px-4 py-2 rounded font-bold cursor-pointer text-sm" onClick={openAddGroupModal}>+ مجموعة جديدة</button>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {data.groups.map(g => {
                                        const count = data.students.filter(s => s.groupId === g.id).length;
                                        return (
                                            <div key={g.id} className="bg-white p-5 rounded-xl shadow border flex flex-col justify-between">
                                                <div>
                                                    <div className="flex justify-between items-start">
                                                        <h3 className="text-lg font-bold text-gray-800">{g.name}</h3>
                                                        <div className="flex gap-2">
                                                            <button className="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-2 py-1 rounded font-bold cursor-pointer" onClick={() => openEditGroupModal(g)}>تعديل</button>
                                                            <button className="bg-red-100 hover:bg-red-200 text-red-700 text-xs px-2 py-1 rounded font-bold cursor-pointer" onClick={() => handleDeleteGroup(g.id)}>حذف</button>
                                                        </div>
                                                    </div>
                                                    <p className="text-sm text-gray-600 mt-2"><strong>المواعيد:</strong> {g.days || "غير محددة"}</p>
                                                    <p className="text-sm text-gray-600"><strong>الاشتراك الشهري:</strong> {g.fee ? `${g.fee} جنيه` : "غير محدد"}</p>
                                                    <p className="text-sm text-[#7A8C63] font-bold mt-2">عدد الطلاب: {count}</p>
                                                </div>
                                                <div className="mt-4 pt-3 border-t flex justify-end">
                                                    <button className="text-xs text-[#7A8C63] hover:underline font-bold cursor-pointer" onClick={() => { setSelectedGroup(g.id); setActiveTab("attendance"); }}>إدارة الحضور والمجموعات ⬅</button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* Students */}
                        {activeTab === "students" && (
                            <div>
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-2xl font-bold text-gray-800">قائمة الطلاب</h2>
                                    <button className="bg-[#7A8C63] text-white px-4 py-2 rounded font-bold cursor-pointer text-sm" onClick={openAddStudentModal}>+ طالب جديد</button>
                                </div>

                                <div className="mb-4">
                                    <select className="border p-2 rounded bg-white w-full sm:w-64" value={studentTabFilter} onChange={e => setStudentTabFilter(e.target.value)}>
                                        <option value="">جميع المجموعات</option>
                                        {data.groups.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                                    </select>
                                </div>

                                <div className="bg-white rounded-xl shadow border overflow-x-auto">
                                    <table className="w-full text-right border-collapse">
                                        <thead>
                                            <tr className="bg-gray-100 border-b text-sm font-bold text-gray-700">
                                                <th className="p-3">اسم الطالب</th>
                                                <th className="p-3">المجموعة</th>
                                                <th className="p-3">هاتف الطالب</th>
                                                <th className="p-3">هاتف ولي الأمر</th>
                                                <th className="p-3 text-center">السجلات التفصيلية</th>
                                                <th className="p-3 text-center">إجراءات</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {studentsListDisplayed.map(s => {
                                                const group = data.groups.find(g => g.id === s.groupId);
                                                return (
                                                    <tr key={s.id} className="border-b hover:bg-gray-50 text-sm">
                                                        <td className="p-3 font-bold">{s.name}</td>
                                                        <td className="p-3">{group ? group.name : "-"}</td>
                                                        <td className="p-3">{s.studentPhone || "-"}</td>
                                                        <td className="p-3">{s.parentPhone || "-"}</td>
                                                        <td className="p-3 text-center space-x-1 space-x-reverse">
                                                            <button className="bg-blue-50 text-blue-600 px-2 py-1 rounded text-xs font-bold hover:bg-blue-100 cursor-pointer" onClick={() => setDetailModal({ student: s, type: "attendance" })}>الحضور</button>
                                                            <button className="bg-amber-50 text-amber-600 px-2 py-1 rounded text-xs font-bold hover:bg-amber-100 cursor-pointer" onClick={() => setDetailModal({ student: s, type: "grades" })}>الدرجات</button>
                                                            <button className="bg-emerald-50 text-emerald-600 px-2 py-1 rounded text-xs font-bold hover:bg-emerald-100 cursor-pointer" onClick={() => setDetailModal({ student: s, type: "payments" })}>المصروفات</button>

                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white p-6 rounded-xl max-w-md w-full shadow-lg">
                                <h3 className="text-xl font-bold mb-4">{editingStudent ? "تعديل بيانات طالب" : "إضافة طالب جديد"}</h3>
                                <div className="flex flex-col gap-3">
                                    <input className="border p-2 rounded" type="text" placeholder="اسم الطالب الثلاثي" value={sForm.name} onChange={e => setSForm({ ...sForm, name: e.target.value })} />
                                    <select className="border p-2 rounded bg-white" value={sForm.groupId} onChange={e => setSForm({ ...sForm, groupId: e.target.value })}>
                                        <option value="">اختر المجموعة</option>
                                        {data.groups.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                                    </select>
                                    <input className="border p-2 rounded" type="text" placeholder="رقم هاتف الطالب" value={sForm.studentPhone} onChange={e => setSForm({ ...sForm, studentPhone: e.target.value })} />
                                    <input className="border p-2 rounded" type="text" placeholder="رقم هاتف ولي الأمر" value={sForm.parentPhone} onChange={e => setSForm({ ...sForm, parentPhone: e.target.value })} />
                                    <div className="flex justify-end gap-2 mt-4">
                                        <button className="bg-gray-200 px-4 py-2 rounded text-sm font-bold cursor-pointer" onClick={() => setSModal(false)}>إلغاء</button>
                                        <button className="bg-[#7A8C63] text-white px-4 py-2 rounded text-sm font-bold cursor-pointer" onClick={handleSaveStudent}>حفظ</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal التفاصيل الشاملة للطالب */}
                    {detailModal && detailModalData && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white p-6 rounded-xl max-w-lg w-full shadow-lg max-h-[80vh] flex flex-col">
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <h3 className="text-xl font-bold text-gray-800">
                                        سجل {detailModal.type === 'attendance' ? 'الحضور' : detailModal.type === 'grades' ? 'الدرجات' : 'المدفوعات'}: {detailModal.student.name}
                                    </h3>
                                    <button className="text-gray-500 hover:text-black font-bold text-lg cursor-pointer" onClick={() => setDetailModal(null)}>✕</button>
                                </div>

                                <div className="overflow-y-auto flex-1">
                                    {detailModal.type === "attendance" && (
                                        <div>
                                            <div className="grid grid-cols-3 gap-2 text-center mb-4 text-xs font-bold">
                                                <div className="bg-emerald-50 p-2 rounded border border-emerald-200">حضور: {detailModalData.present}</div>
                                                <div className="bg-red-50 p-2 rounded border border-red-200">غياب: {detailModalData.absent}</div>
                                                <div className="bg-blue-50 p-2 rounded border border-blue-200">النسبة: {detailModalData.percentage}%</div>
                                            </div>
                                            <table className="w-full text-right text-xs">
                                                <thead>
                                                    <tr className="bg-gray-100 border-b">
                                                        <th className="p-2">التاريخ</th>
                                                        <th className="p-2 text-center">الحالة</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {detailModalData.records.map(r => (
                                                        <tr key={r.id} className="border-b">
                                                            <td className="p-2">{r.date}</td>
                                                            <td className="p-2 text-center font-bold">
                                                                <span className={r.status === 'حضور' ? 'text-emerald-600' : 'text-red-600'}>{r.status}</span>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}

                                    {detailModal.type === "grades" && (
                                        <div>
                                            <div className="bg-amber-50 p-2 rounded border border-amber-200 text-center mb-4 text-xs font-bold text-amber-800">
                                                المعدل العام: {detailModalData.avg}% ({detailModalData.totalScore} / {detailModalData.totalMax})
                                            </div>
                                            <table className="w-full text-right text-xs">
                                                <thead>
                                                    <tr className="bg-gray-100 border-b">
                                                        <th className="p-2">التاريخ</th>
                                                        <th className="p-2">الاختبار</th>
                                                        <th className="p-2 text-center">الدرجة</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {detailModalData.records.map(r => (
                                                        <tr key={r.id} className="border-b">
                                                            <td className="p-2">{r.date}</td>
                                                            <td className="p-2">{r.title}</td>
                                                            <td className="p-2 text-center font-bold">{r.score} / {r.maxScore}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}

                                    {detailModal.type === "payments" && (
                                        <div>
                                            <div className="bg-emerald-50 p-2 rounded border border-emerald-200 text-center mb-4 text-xs font-bold text-emerald-800">
                                                إجمالي المدفوعات: {detailModalData.totalPaid} جنيه
                                            </div>
                                            <table className="w-full text-right text-xs">
                                                <thead>
                                                    <tr className="bg-gray-100 border-b">
                                                        <th className="p-2">الشهر</th>
                                                        <th className="p-2 text-center">المبلغ</th>
                                                        <th className="p-2 text-center">الحالة</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {detailModalData.records.map(r => (
                                                        <tr key={r.id} className="border-b">
                                                            <td className="p-2">{r.month}</td>
                                                            <td className="p-2 text-center">{r.amount} جنيه</td>
                                                            <td className="p-2 text-center font-bold text-emerald-600">{r.status}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>

                                <div className="mt-4 pt-3 border-t text-left">
                                    <button className="bg-gray-200 px-4 py-2 rounded text-xs font-bold cursor-pointer" onClick={() => setDetailModal(null)}>إغلاق</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
